name: Build MediBill Windows EXE

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        shell: cmd
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller
      - name: Build
        shell: cmd
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name MediBill main.py
      - name: Verify
        shell: powershell
        run: |
          if (!(Test-Path "dist\MediBill.exe")) { throw "MediBill.exe was not created." }
      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: MediBill-Windows-EXE
          path: dist/MediBill.exe
          if-no-files-found: error
