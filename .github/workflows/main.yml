name: Build MediBill Windows EXE

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller
      - name: Build standalone EXE
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name MediBill main.py
      - name: Verify EXE
        shell: powershell
        run: |
          if (!(Test-Path "dist\MediBill.exe")) { throw "MediBill.exe was not created" }
          Get-Item "dist\MediBill.exe"
      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: MediBill-Windows-EXE
          path: dist/MediBill.exe
          if-no-files-found: error
